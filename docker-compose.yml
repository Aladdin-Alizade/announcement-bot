services:
  bot:
    build: .
    container_name: announcement-bot
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      SQLITE_PATH: /data/announcement.db
      SCRAPER_FLARESOLVERR_URL: ${SCRAPER_FLARESOLVERR_URL:-http://flaresolverr:8191}
    volumes:
      - bot_data:/data
    depends_on:
      - flaresolverr
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: announcement-bot-flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: Asia/Baku
    restart: unless-stopped

volumes:
  bot_data:
